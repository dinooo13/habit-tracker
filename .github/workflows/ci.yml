name: CI/CD

# Unified pipeline (mirrors dinooo13/fmeyer.dev, adapted to npm + this SPA):
#   - test + build run on every push and PR.
#   - deploy-production runs on push to main when site files changed; reuses the
#     build artifact and mirrors it to habits.fmeyer.dev over FTPS.
#   - deploy-preview runs on same-repo PRs when site files changed; each PR is
#     deployed to ./previews/pr-<n>/ on preview.habits.fmeyer.dev.
#   - cleanup-preview removes the PR directory on close.
#
# Required hosting/secrets (see PR description): preview.habits.fmeyer.dev must
# be configured in the hosting panel to serve from the preview FTP account's
# ./previews/ directory; secrets SFTP_HOST, SFTP_PROD_USER, SFTP_PROD_PASSWORD
# (production) and SFTP_PREVIEW_USER, SFTP_PREVIEW_PASSWORD (preview) must be set,
# plus `production` and `preview` GitHub Environments.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; never cancel branch pushes (avoid killing FTP mid-upload).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
             || [ -z "$BASE_SHA" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(app/|public/|e2e/|nuxt\.config\.ts$|playwright\.config\.ts$|package\.json$|package-lock\.json$|tsconfig\.json$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck

  build:
    name: Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      # Stamp the generated build with the commit SHA so the post-deploy
      # production-smoke job can confirm which build is live (ADR-0020). For a
      # push to main this is the merge commit = the deployed SHA the poll waits
      # for. Applies to both the production and preview "Generate" steps below.
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Nuxt build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .nuxt
            .nitro
            node_modules/.cache
          key: nuxt-build-${{ runner.os }}-${{ runner.arch }}-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}-${{ hashFiles('package-lock.json', 'app/**', 'public/**', 'nuxt.config.ts', 'tsconfig.json') }}
          restore-keys: |
            nuxt-build-${{ runner.os }}-${{ runner.arch }}-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}-

      - name: Generate static site (production)
        if: github.event_name != 'pull_request'
        run: npm run generate

      - name: Generate static site (preview)
        if: github.event_name == 'pull_request'
        env:
          NUXT_APP_BASE_URL: /pr-${{ github.event.pull_request.number }}/
          NUXT_PUBLIC_NOINDEX: 'true'
        run: npm run generate

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-output
          path: .output/public
          # Required so .htaccess (a dotfile) is packed into the artifact —
          # upload-artifact strips hidden files by default.
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  e2e:
    name: E2E
    needs: changes
    # Skip on docs-only changes (same filter as the deploy jobs).
    if: github.event.action != 'closed' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Cache the Playwright browser binaries, keyed on the installed version.
      - name: Resolve Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Tests run against a locally built-and-served copy of the app; the
      # webServer in playwright.config.ts handles `npm run build && npm run preview`.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  deploy-production:
    if: |
      needs.changes.outputs.site == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: [changes, test, build]
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: deploy-production
    environment:
      name: production
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-output
          path: .output/public

      - name: Install lftp
        run: |
          sudo apt-get install -y --no-install-recommends lftp \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp)

      - name: Deploy via FTPS
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_PROD_USER }}
          FTP_PASS: ${{ secrets.SFTP_PROD_PASSWORD }}
        run: |
          # ./httpdocs/ is the document root for habits.fmeyer.dev relative to the
          # production FTP account. Adjust if your account lands elsewhere.
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1.5
          set net:timeout 30
          set mirror:use-pget-n 4
          set mirror:parallel-directories yes
          mirror --reverse --delete --continue --parallel=4 --verbose ./.output/public/ ./httpdocs/
          bye
          EOF

  # Post-deploy verification (ADR-0020, issue #87). Runs only after a successful
  # production deploy, behind the same `site` change filter. It first proves the
  # deployed SHA is actually live (version.json poll) — FTPS mirroring is not
  # atomic and the host may cache, so a check run right after deploy can be served
  # the previous build and pass — then drives the `@production`-tagged subset
  # against the live origin. On failure it files one label-less bug issue (no
  # dedup) and goes red; it never fixes, rolls back, pushes, or merges.
  production-smoke:
    name: Production smoke
    needs: [changes, deploy-production]
    if: |
      needs.changes.outputs.site == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      issues: write
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
      PROD_URL: https://habits.fmeyer.dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Reuse the same browser-cache strategy as the `e2e` job.
      - name: Resolve Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Fail-fast SHA gate: poll version.json (cache-busted) until it reports the
      # deployed SHA, on a short bounded window. Without this the smoke run could
      # pass against a stale build — the exact false green it exists to catch.
      - name: Wait for the deployed SHA to go live
        id: poll
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for $PROD_URL/version.json to report $EXPECTED_SHA (~90s bounded)…"
          live_last=""
          for i in $(seq 1 18); do
            body="$(curl -fsS "$PROD_URL/version.json?ts=$(date +%s)" || true)"
            live="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).commit||""))}catch{process.stdout.write("")}})')"
            live_last="$live"
            echo "attempt $i/18: live=${live:-<none>}"
            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "Deployed SHA is live."
              exit 0
            fi
            sleep 5
          done
          # Record what the poll last saw so the failure-issue composer can report
          # "served def5678 for ~90s" instead of a bare timeout. Outputs written
          # before a non-zero exit remain readable by later steps (issue #107).
          {
            echo "live_sha=$live_last"
            echo "attempts=18"
            echo "window_seconds=90"
          } >> "$GITHUB_OUTPUT"
          echo "::error::version.json never reported $EXPECTED_SHA within the poll window (stale or absent deploy)."
          exit 1

      - name: Run production smoke tests
        id: smoke
        env:
          E2E_SKIP_WEB_SERVER: '1'
          E2E_BASE_URL: ${{ env.PROD_URL }}
        run: npx playwright test --grep @production --retries=2

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      # Compose the failure issue body from a pure, unit-tested module
      # (scripts/ci/production-smoke-issue.mjs, issue #107): it parses the
      # Playwright JSON report, renders the repo's bug-report shape, and writes
      # `{title, body}` JSON for the next step to file. Gated on the two real
      # gates only — a bare `failure()` here would file issues for `checkout` /
      # `npm ci` / `playwright install` flakes, which are not production outages.
      - name: Compose failure report
        id: report
        if: ${{ !cancelled() && (steps.poll.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        env:
          FAILURE_MODE: ${{ steps.poll.outcome == 'failure' && 'poll' || 'smoke' }}
          DEPLOYED_SHA: ${{ github.sha }}
          LIVE_SHA: ${{ steps.poll.outputs.live_sha }}
          POLL_ATTEMPTS: ${{ steps.poll.outputs.attempts }}
          POLL_WINDOW_SECONDS: ${{ steps.poll.outputs.window_seconds }}
          BASE_URL: ${{ env.PROD_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          PLAYWRIGHT_VERSION: ${{ steps.pw.outputs.version }}
          RUNNER_IMAGE: ubuntu-24.04-arm
          RUNNER_OS_ARCH: ${{ runner.os }}/${{ runner.arch }}
          NODE_VERSION: '22'
          JSON_REPORT: test-results/production-smoke-results.json
          OUTPUT_FILE: ${{ runner.temp }}/production-smoke-issue.json
        run: node scripts/ci/production-smoke-issue.mjs

      # One label-less issue per failure — no dedup (three bad deploys ⇒ three
      # issues, deliberate per ADR-0020 §5). Label-less so normal triage stays the
      # front door; recommended labels are named as text in the body. Same gate as
      # the composer; body read from the composer's temp file (no YAML escaping).
      - name: File a failure issue
        if: ${{ !cancelled() && (steps.poll.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_FILE: ${{ runner.temp }}/production-smoke-issue.json
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { title, body } = JSON.parse(readFileSync(process.env.REPORT_FILE, 'utf8'));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Record tested SHA
        if: success()
        shell: bash
        run: |
          {
            echo "### Production smoke ✓"
            echo ""
            echo "Verified deployed SHA \`${{ github.sha }}\` is live at $PROD_URL and passed the \`@production\` smoke subset."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.site == 'true'
    needs: [changes, test, build]
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-output
          path: .output/public

      - name: Install lftp
        run: |
          sudo apt-get install -y --no-install-recommends lftp \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp)

      - name: Deploy via FTPS
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_PREVIEW_USER }}
          FTP_PASS: ${{ secrets.SFTP_PREVIEW_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # preview.habits.fmeyer.dev serves from ./previews/ on the preview FTP
          # account; each PR gets its own ./previews/pr-<n>/ subdirectory.
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1.5
          set net:timeout 30
          set mirror:use-pget-n 4
          set mirror:parallel-directories yes
          mirror --reverse --delete --continue --parallel=4 --verbose ./.output/public/ ./previews/pr-${PR_NUMBER}/
          bye
          EOF

  set-environment-url:
    needs: [deploy-production, deploy-preview]
    if: |
      !cancelled() &&
      (needs.deploy-production.result == 'success' || needs.deploy-preview.result == 'success')
    runs-on: ubuntu-24.04-arm
    permissions:
      deployments: write
    steps:
      - name: Set deployment URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isPreview = context.eventName === 'pull_request';
            const env = isPreview ? 'preview' : 'production';
            const sha = isPreview ? context.payload.pull_request.head.sha : context.sha;
            const url = isPreview
              ? `https://preview.habits.fmeyer.dev/pr-${context.payload.pull_request.number}/`
              : 'https://habits.fmeyer.dev';
            const { owner, repo } = context.repo;

            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment: env,
              sha,
              per_page: 100
            });
            deployments.sort((a, b) => b.id - a.id);
            const deployment = deployments[0];
            if (!deployment) {
              core.setFailed(`No deployment found for SHA ${sha} in ${env} environment`);
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: url,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });

  cleanup-preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    permissions:
      deployments: write
    steps:
      - name: Install lftp
        run: |
          sudo apt-get install -y --no-install-recommends lftp \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp)

      - name: Delete preview directory
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_PREVIEW_USER }}
          FTP_PASS: ${{ secrets.SFTP_PREVIEW_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set cmd:fail-exit no
          rm -r ./previews/pr-${PR_NUMBER}
          bye
          EOF

      - name: Deactivate preview deployments for this PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://preview.habits.fmeyer.dev/pr-${prNumber}/`;
            const { owner, repo } = context.repo;

            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment: 'preview',
              per_page: 100
            });

            for (const d of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: d.id,
                per_page: 1
              });
              const latest = statuses[0];
              if (latest?.environment_url !== previewUrl) continue;

              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: d.id,
                state: 'inactive'
              });
              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: d.id
              });
            }
