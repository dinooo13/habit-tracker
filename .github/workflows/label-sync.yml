name: Label sync

# Keeps the repo's labels in sync with .github/labels.yml (the taxonomy documented
# in docs/WORKFLOW.md). Runs on pushes to main that touch the label file, and can be
# triggered manually. Uses the built-in GITHUB_TOKEN — no PAT required.
#
# .github/labels.yml is the single source of truth: github-label-sync creates and
# updates the labels it lists AND deletes any repo label that is not in the file
# (its default behaviour). Add a label to the file before relying on it.

on:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: label-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Sync labels from .github/labels.yml
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -y github-label-sync@3.0.0 \
            --access-token "$GITHUB_ACCESS_TOKEN" \
            --labels .github/labels.yml \
            "$GITHUB_REPOSITORY"
